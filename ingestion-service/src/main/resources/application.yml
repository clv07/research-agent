spring:
  application:
    name: ingestion-service
  mvc:
    problemdetails: 
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
      
server:
  # 8080 is reserved for the gateway
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
