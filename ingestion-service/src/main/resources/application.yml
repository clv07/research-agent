spring:
  application:
    name: ingestion-service
  mvc:
    problemdetails: 
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:postgresql://localhost:5432/paper_db
    username: svt
    password: paper-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  ai:
    vectorstore:
      pgvector:
        dimensions: 384
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: false  #Flyway owns the schema
        
server:
  # 8080 is reserved for the gateway
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
