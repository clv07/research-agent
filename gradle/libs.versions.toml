# Version catalog: the single place where dependency and plugin versions live.
# Modules refer to these as libs.<name> and libs.plugins.<name>.
# https://docs.gradle.org/current/userguide/version_catalogs.html

[versions]
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
spring-ai = "2.0.2"

[libraries]
# Without version.ref: Spring Boot BOM picks them.
spring-boot-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai"}
spring-ai-pdf-reader = { module = "org.springframework.ai:spring-ai-pdf-document-reader"}
spring-ai-model-transformers = { module = "org.springframework.ai:spring-ai-starter-model-transformers"}
spring-ai-vector-store = { module = "org.springframework.ai:spring-ai-starter-vector-store-pgvector"}

postgresql-postgresql = { module = "org.postgresql:postgresql" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }

junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
