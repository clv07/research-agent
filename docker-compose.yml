services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: {
      POSTGRES_DB: "paper_db", 
      POSTGRES_USER: "svt",
      POSTGRES_PASSWORD: "paper-service"
    }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data] # data survives after docker compose down
    healthcheck: 
      test: [
        "CMD-SHELL", 
        "pg_isready -U svt -d paper_db"
        ]

volumes:
  pgdata: